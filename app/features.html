               border-left: 3px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes { margin: 10px 0 0; padding-left: 18px; color: var(--text); }

  .meta { margin-top: 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

      "2026-10-31 (Connection): Built; not yet on the live PC. The guard (agent/guard.ts) is a program of its own, apart from the app, that: (1) starts the agent and starts it again within about a second of its exit, and within seconds of its hanging (a health look every second; 8 failed looks in a row after a 90 s boot grace), waiting 2, 5, 10, 20, 30 s if it keeps dying right after starting; (2) serves the page on 5173 itself, so 5173 always has a listener whatever happens to the agent, and answers /guard/status: the page's one small sign then says 'The app is restarting. Back in about N s.' with Control (RustDesk) and Backup page (Christopher, 4740) links instead of a dead error; (3) runs the hub's RustDesk servers (hbbs/hbbr) in a keeper process of its own (agent/hub/keeper.ts), so killing, crashing or updating the agent leaves them up and Control works through it; (4) is the only one: it holds port 21228, and a second guard exits at once. It is started by a Scheduled Task, ShubhamAgenticGuard (at logon and every minute, one at a time, no admin), and by the Startup launcher; Christopher running that launcher from 4740 starts nothing twice. The chats that were open are written to <state>/agentic/open-chats.json and reopened with their conversation resumed (resumeChat) after a restart; the ones that were working are told 'The app restarted and reopened this chat. Carry on from where you were.' The app's own taskkill /T (chats.ts, librarian.ts) is replaced by ending exact PIDs by start time (agent/proc-tree.ts: a child must have started at or after its parent), so the hazard behind the 22:06 crash is out of the app and the guard both. The old way is untouched and still works: Start.cmd; Install-Guard.cmd -Remove goes back to it. To install on the live PC (not done): Install-Guard.cmd -Role hub in the build folder; it takes over from Start.cmd's loop by exact PID and adopts the running app, so there is no moment without it. Files: agent/guard.ts, agent/guard/*, agent/hub/{keeper,keeper-state,external-servers}.ts, agent/proc-tree.ts, agent/agentic/recover.ts (+ resumeChat in index.ts, chats.ts, librarian.ts), agent/ui-server.ts (a handle hook), agent/main.ts, agent/scripts/build-files/{Guard.cmd,Guard hidden.vbs,Install-Guard.cmd,Install-Guard.ps1}, shared/guard-note.ts, src/lib/live/{guard.ts,LinkBanner.tsx}; docs in agent/SPEC.md (F-058), README and the build's README.",

    "title": "Voice button in chats on the phone: one tap and speak, no keyboard",
    "said": "(Shubham, through the overlay Assistant, relayed by it:) Build a voice-input feature for the chat on the phone. The problem: today, to talk to a chat he has to tap the input window (the keyboard opens), then tap the Wispr Flow button on his phone, then speak, then press send. Most of the time he is speaking directly through the phone, so those first two taps are pointless. What he wants: A voice button in the chat (overlay chat and the phone chat) that starts listening immediately and automatically transcribes what he says into the chat. No input window / keyboard should open. The input window stays available: if he wants to type, he can open it, but it must not be the default path. Build an internal speech system on the phone itself, so he can start speaking right away without opening the keyboard, tapping Wispr Flow, speaking, and pressing send. Solve that whole flow: one tap (or less) to start speaking, the transcript goes into the chat, then send. … Do not publish or press Update now without asking Shubham first.",
    "added": "2026-11-01",
    "notes": [
      "2026-11-01: Decided (Lead): the browser's own speech recognition (Web Speech API, Chrome on Android, the phone's Google speech), in the web app, since the phone uses the web app and the native APK is on hold. A big mic button in every chat composer (Chats conversation, the overlay, which reuses it, and the Agents window on the phone). One tap and it listens at once, without focusing the input, so no keyboard opens. Live words show in a strip as he speaks. Tap again (or a pause) to stop. Then the text goes into the draft with Send ready; a Settings switch, \"Send when I stop speaking\", sends it on its own. The keyboard stays one tap away. Language: English (India) by default, set in Settings. The mic needs a secure page (https or localhost): check the phone's address is https; if not, the button says why. Fallback where the browser has no speech API: record → transcribe on the server (only if a free local engine exists; otherwise hide the button with a note). Given to Web, before F-066. Not published until Shubham says yes.",
      "2026-11-01 (Web): BUILT, NOT PUBLISHED (waiting for Shubham's yes). The message box (Chats conversation, the overlay since it reuses it, an Agents window on the phone) has a big mic: with the box empty it is the right-hand button (48 px, primary). One tap listens at once, with the focus left alone, so no keyboard opens; a strip shows the words live (sure words normal, uncertain ones dimmer); a pause or a tap on Stop listening ends it and the words go on the end of the draft with Send ready (a second tap adds more). With words in the box a small ghost mic stays one tap away beside the paperclip; the keyboard is one tap on the field. Settings › Voice: the switch 'Send when I stop speaking' (off to start with: on, a pause sends the message unless a file is still going up), and the language (English India by default; also US, UK, Hindi, Marathi, Gujarati), kept in this browser, and a line saying whether this page can listen. Uses the browser's speech recognition (continuous off, interim results on). The page address: the remote gate https://server.tailc768e5.ts.net:5173 IS https (checked from this PC: 200, valid certificate), so the microphone works on the phone there; an http address (the tailnet address on 5190, an IP) is not a secure page: there the mic is dimmed and a tap says so and names the https address. Where the browser has no speech recognition the mic is hidden and Settings says so; no server-side fallback was built (no local speech engine on this PC). The Agents window: a mic in its title bar types the words at the prompt (Enter too when the switch is on). Checked: 7 tests of the rules (shared/voice.test.ts); in headless Chrome with a pretend recogniser, at 360 touch light and 1280 dark: listening state and strip, live words, a pause fills the draft with Send ready and the field unfocused, a second go adds to it, a tap stops and keeps the uncertain words, the language comes from Settings, send-on-pause sends, an insecure page explains itself, Settings › Voice, no sideways scroll. NOT checked: a real microphone and Google's speech service on a real phone (headless Chrome has none), whether Chrome on the phone ends at a pause as expected, the Agents window's mic (type-checked only), iOS Safari.",
      "2026-11-01: Changes from Shubham after trying it on the phone (relayed by the overlay Assistant). 1) \"when I am speaking the speaker button just shuts down after I stop speaking. I want a button to shut it down when I want to. If I just stop speaking it should not shut down. Only when I press the button should it stop recording me.\" So it keeps listening through pauses and silence, and stops ONLY on his press of the same button. When the browser's engine ends by itself, restart it silently and keep the text, so it feels like one recording. A clear pulsing listening state. 'Send when I stop speaking' now means send when he presses stop (Web's call to keep or drop it). 2) \"when I press the voice button the keyboard automatically opens. I don't want the keyboard opening when I press it. I think you have to separate it out from the keyboard area.\" So the mic never focuses the box. preventDefault on pointerdown/mousedown so focus isn't stolen, and blur the box if it was focused (closing an open keyboard is fine). The mic is its own control outside the input, and the live words show without the box focused (read-only). Typing stays a separate tap on the box. (Lead)",
      "2026-11-01 (Web), round 2 after Shubham's phone try: BUILT, NOT PUBLISHED. (1) It no longer stops when he stops speaking: it listens until the same button is pressed again. Chrome's engine ends a stretch at every pause or after a few seconds of silence; each ending is turned into a silent restart that keeps the words (one recording; the live strip shows everything said so far; the button has a pulsing ring, steady under reduced motion). Real errors (microphone blocked, no network, no microphone) still end it, keeping the words, with their message; it also stops after 2 minutes of nobody speaking and when the page is hidden. 'Send when I stop speaking' now sends when he presses to stop. (2) The mic never focuses the box: the press is stopped from moving the focus in both pointer and mouse events (on the right-hand button and the small mic), a box that has the focus is blurred when listening starts (so an open keyboard closes), and the words show in a strip that is not an input; the mic was already its own control outside the input area. Checked with real touch sequences (CDP Input.dispatchTouchEvent) at 360 on the fixture, a pretend recogniser that ends by itself like Chrome's: document.activeElement stays BODY through start, pauses, silences and stop (a focusin listener counted 0 textarea focuses); with the box focused beforehand the mic tap blurs it and it never comes back; a pause and two silences gave restarts (starts 2 then 4) with the words kept and the button still Stop listening; one tap on stop put the whole recording in the draft; a real error ended it with the message and kept the words. NOT checked: Chrome on the real phone: whether its engine beeps or flickers on each silent restart, and the keyboard not opening there (I could only prove the page never focuses the box). If it still opens, the cause is outside the page's focus handling (the phone's keyboard app, e.g. Wispr Flow's own overlay)."

    "title": "Every agent answers the overlay Assistant: replies come back to it, no loops",
    "said": "(Shubham, through the overlay Assistant, relayed by it:) All agents should respond to the overlay assistant. Shubham will only talk to the overlay assistant, not to dozens of agents. So build an internal message system / standing system prompt for every agent, so that when the overlay assistant sends an agent an order, that agent's answer comes back to the overlay assistant, and Shubham sees it there. He does not want to open each chat to read the replies. Please design it so it does not create endless back-and-forth loops (for example: one reply per order, no acknowledgement-only replies, and replies only to the overlay assistant, not broadcast). … do not publish or press Update now without asking Shubham first.",
    "added": "2026-11-01",
    "notes": [
      "2026-11-01: Decided (Lead): done by the APP, not left to each agent's memory. 1) An order sent by the Assistant (app_send_to_chat / send_to_chat from the Assistant's chat) is recorded as an open order {id, from: Assistant, to: chat}. 2) When that agent's turn ends (it goes back to waiting), the app takes its final answer text of that turn and delivers it to the Assistant's chat as \"[reply from <Agent> on <Floor> to order <id>] …\", and closes the order. 3) No loops: exactly ONE reply per order; a reply is never itself an order (it opens no new order and is never relayed back); an Assistant message that is just an acknowledgement (or a reply to a reply) opens no order; replies go only to the Assistant, never broadcast. Long work: if a turn ends while the agent says it's still working, that is the reply; later news goes as the agent's own send to the Assistant (also no order). 4) Every agent's standing brief (briefs.ts) gets a line: orders from the Assistant come from Shubham; your answer at the end of the turn goes back to him automatically, so make it the report; don't send acknowledgements. 5) The overlay shows replies as they arrive (the Assistant tells Shubham in plain words). A long reply is trimmed with the chat's link. Owner: Overlay (it owns the Assistant), after F-070 step 2. Not published until Shubham says yes.",
      "2026-11-01 (Overlay): Built and tested, switched OFF until Shubham says yes. agent/agentic/orders.ts records an order when the Assistant sends one (app_send_to_chat / send_to_chat), marks the message with \", order <id>\", and when that agent's turn ends (its chat rests twice running; the answer is the last text it wrote after the marked message, from its transcript) types \"[reply from <Agent> on <Floor> to order <id>] ...\" into the Assistant's chat, once. No loops: one reply per order; a reply opens no order and goes only to the Assistant; acknowledgements (\"ok\", \"thanks\") open none; only the Assistant's own messages open orders; a reply the Assistant could not take is kept and delivered once later; orders are kept in orders.json across restarts; nothing answered after 3 h is reported as still working. Every brief gets the end-of-turn line (briefs.ts ORDER_LINE) only while it is on. To turn it on: SAD_ORDER_REPLIES=1 (or an order-replies.on file in the agent's agentic folder) AND ORDER_REPLIES = true in src/overlay/brief.ts. Tests: orders.test.ts (rules, replies, restart), orders-api.test.ts.",
      "2026-11-01 (Overlay): Switched ON as built, after Shubham's yes (confirmed by Lead). On by default; the old way stays: SAD_ORDER_REPLIES=0 or an order-replies.off file in the agent's agentic folder turns replies off (then ORDER_REPLIES = false in src/overlay/brief.ts, so the Assistant's brief promises nothing the app does not do). The line telling every agent that its end-of-turn answer goes back automatically (briefs.ts) goes with it."

  {
    "id": "F-074",
    "title": "TOP PRIORITY: \"Hey Chris\" with the phone's screen off or locked: wake word, spoken reply, voice conversation with the Assistant (Android APK)",
    "said": "(Shubham, through the overlay Assistant, relayed by it:) one major thing to be added now: my phone screen will be off, maybe locked. I need the ability to just say 'Hey Chris', and then you [the assistant] say 'yes, what is required', and then I talk to you. I need that feature ASAP. I don't care how long it takes but it has to be very accurate. My screen will be off. The app is currently a browser app; let me know about making it an APK too, for taking whole control of my phone and all that. Let me know how it is built, but this is a priority.",
    "added": "2026-11-01",
    "notes": [
      "2026-11-01: Read as (Lead): a browser page can't listen with the screen off or locked, so this is the Android app (APK), Mobile's, un-paused for it. Phase 1: a foreground service holding the mic (the persistent notification, a big off switch). An on-device wake word \"Hey Chris\" that is accurate for his Indian-English voice, low on battery and offline (compare Porcupine custom keyword, openWakeWord, Vosk; measure false accepts and misses). Then a sound plus spoken \"Yes, what is required?\" (TTS), his words recognised and sent to the overlay Assistant's chat, and the Assistant's answer spoken back. The session ends on \"thanks Chris\", a silence timeout or the notification button. It must work with the screen off or locked, survive Doze, battery optimisation and Samsung's sleeping-apps, and handle a Bluetooth headset. Hub side (Overlay, which owns the Assistant): a voice-turn endpoint (text in, the Assistant's answer out when its turn ends, like F-072) and short spoken answers. Phase 2, optional, its own explicit yes: \"whole control of the phone\" through an Android AccessibilityService (open apps, tap, read the screen), with a visible indicator. Android forbids bypassing the lock-screen PIN, and a sideloaded app needs \"Allow restricted settings\" before accessibility can be turned on. Standing rules: the APK never carries the app's API token (it pairs as a device); the signing key stays on this PC, out of git, never printed; any wake-word vendor key is a secret, out of git and never printed. FIRST a short plain plan back to Lead and the Assistant (how it's built, what Shubham does on the phone, what can't be done and why, time per step); then build step by step, honest about what wasn't tested on the real phone. No publish, release build or Update now without Shubham's yes.",
      "2026-11-01: Plan (Mobile), sent to Lead; nothing built until the go. A small native Kotlin app, Chris: a microphone foreground service with a notification that stays (Stop, Pause 1 h) and a big on/off switch. WAKE WORD: openWakeWord, a 'Hey Chris' model trained for him (synthetic voices plus about 100 clips of him saying it) with a check that it is his voice; target 95 of 100 caught and at most 1 false wake per 10 hours, measured on his clips and a day of his real sound; until it is trained, sherpa-onnx's keyword spotter with the phrase typed as text. Not Porcupine: Picovoice told users its free keys stopped working on 30 June 2026 (enterprise only now, and the SDK needs a key checked online at start); not Vosk (a recogniser, not a wake-word engine); microWakeWord (what Home Assistant's Android app uses, locked too) is the second choice. AFTER THE WAKE: a chime and 'Yes, what is required?' (the phone's TTS, English India), then Google's recogniser in English (India) (offline when its pack is installed, else the network; working while locked to be proved on his Fold; fallback an offline recogniser in the app); the Assistant's answer spoken; follow-ups for 15 s without the wake word; ends on 'thanks Chris', 15 s of silence or Stop. Earbuds: spoken through them and listened through their mic in a conversation; the wake word on the phone's mic by default. HUB (Overlay): pairing by a one-time code that gives the phone its own device key (the hub keeps a hash, revocable; never the app's token; an ownAuth /voice/* route through the Tailscale gate); POST /voice/ask {text, locked}, GET /voice/ask/:id?wait=25 for that turn's answer written to be heard, cancel, confirm, config. ON THE FOLD: Auto Blocker off to install or update; microphone, notifications, nearby devices; battery Unrestricted and Never sleeping apps (Chris and Tailscale); after a reboot one tap on Chris's notification once unlocked (since Android 14 an app may not start a microphone service from BOOT_COMPLETED), unless Chris is the phone's default digital assistant (his choice; Gemini then stops being the default). CAN'T: get past the PIN, hide the mic dot or the notification, use the low-power hotword chip (so a noticeable battery cost, measured overnight on his phone), listen during calls. SAFETY: while locked, nothing outward or destructive; those wait for an Approve that needs the unlock; secrets are never read aloud. PHASE 2 (its own yes): an AccessibilityService, which a sideloaded app gets only after 'Allow restricted settings'. TIME: a first usable version in about 5 working days, the trained model 1-2 more, the assistant role 1, then 2-3 days of his trial; no Android emulator on this PC, so device tests are on his Fold. NEEDS HIS YES: phase 1; the JDK and Android tools and the signing key on this PC; test builds by a link on the hub; the assistant role; where training runs; phase 2.",
      "2026-11-01: Shubham, in Mobile's chat: \"One more thing a voice of the agent has to be exactly like jarvis please\". Read as (Lead): Chris speaks in a Jarvis-STYLE voice: a calm, clear, slightly formal British male, with short butler-like phrasing (\"Yes, sir. What do you need?\"). The phone's English (UK) male voice is the start; a better offline neural voice (e.g. a Piper en-GB male) if it sounds closer. Not a clone of the film actor's real voice (Paul Bettany's): copying a real person's voice needs his consent, so we match the style, not the person.",
      "2026-11-01: Shubham, in Mobile's chat, his own words. Asked: \"can this be made on react native and one queston dont hin too.much so hey chris won work when phone locked\" (answered: yes, React Native for the screens with the always-listening part in native Android code inside it; and Hey Chris DOES work with the phone locked, only the PIN and actions needing the screen wait for the unlock). Then: \"yes go with react native, start building but keep sfety option optional start and no question/effort ultracode\" (he turned ultracode on for Mobile's session). Then: \"and make sure when we have this agent where I can talk with hackers it should be a life chatting with him extremely like chatting you can see the agent there Claude manager in that there is life you will implement that or something much much better think very very deep and then make it\". Then the plan's answers: \"Yes to the Hey Chris plan: (a) phase 1 with openWakeWord; (b) install the JDK and Android build tools into %LOCALAPPDATA%\\shubham-agentic\\android, and make the signing key here, out of git and never printed; you may check and use the download sites (Google, Adoptium, GitHub, Maven, npm); (c) test builds by a link over Tailscale only; (d) yes, support Chris as my default assistant; (e) train my voice model on our PCs, not Colab; (f) phase 2 later. Jarvis-style British voice. Ask me before any release or publish.\" Read as (Mobile): build it now. The app is React Native (Expo SDK 58, React Native 0.88) with a native Android module for everything that must run with the screen off (the microphone service, the wake word, speech in and out, earbuds, notifications, the default-assistant service). The safety rule for a locked phone is a setting, off by default. \"Talk with hackers\" is read as \"talk with Chris\": a Live screen with Chris that feels like live chatting, as Claude manager's live chat panel does (its words and its work as they happen) or better: his words as he speaks them, Chris's answer appearing as it is spoken, what Chris is doing right now, and the whole conversation as chat bubbles, by voice or by typing. Lead's additions folded in: the heartbeat's news (F-078) as a quiet notification and a spoken line when a conversation is open; the voice Jarvis-STYLE (a calm, formal British male, offline: a Piper en-GB or Kokoro British male voice, the phone's en-GB male voice as the fallback), never a clone of the actor. Hub side (pairing to a device key, ask and answer, the live feed, the event queue for the heartbeat) sent to Overlay, who builds it. No release or publish without asking him.",
      "2026-11-02 (Overlay): HUB SIDE, stage A, built and in the tree (agent/agentic/voice.ts; tests voice.test.ts, voice-api.test.ts), per Mobile's spec. The phone never gets the app's token: the page asks POST /agent-api/voice/pair-code (token) for a 6-digit code (10 min, burned after 5 wrong tries; 10 tries a minute); the phone trades it at POST /voice/pair {code, name, model} for {deviceId, key} (32 random bytes, shown once; only the sha256 is kept in voice-devices.json; at most 8 phones). Every phone call carries Authorization: Bearer <key> and is refused when it carries an Origin (a browser page). Page routes (token): GET /voice/devices, POST /voice/devices/revoke. Phone routes: GET /voice/hello -> {assistant:{sessionId, live: working|waiting|idle|stopped}, settings}; POST /voice/ask {text, via:'voice'|'text', locked, safety} -> {askId} (typed into the Assistant's chat as '[voice hh:mm, ask <id>] (spoken; phone locked; answer for speech: ...) <words>'; with safety:true and locked:true it is also told to do nothing outward or destructive and say what it would do); GET /voice/ask/:id?wait=25&seen=<json> (long poll) -> {state: queued|working|done|error, status?, speak?, error?} where speak is the Assistant's final answer of that turn as plain sentences (no code, links, markdown; cut at 1200 characters); POST /voice/ask/:id/cancel (Esc into the chat); GET /voice/events?since=<cursor>&wait=25 -> {cursor, events:[{t:'ask'|'answer'|'beat', ...}]} (an answer arrives there even when nobody polled; a heartbeat beat arrives there too, as {t:'beat', at, text, items:[{floor, agent, what}]}). NOT YET (stage B): GET /voice/live (the Assistant's chat feed over a WebSocket: the API's WebSocket upgrade wants the app token today, so this needs a reviewed change in agent/api.ts), GET /voice/history, and POST /voice/confirm/:id (the safety rule's Approve). The page's 'Pair Chris (Android)' button and device list (Revoke) are not built yet.",

      "2026-11-01 (Overlay): Overlay part built. 1) Human-only guard (src/overlay/driver.ts): anything that is, or sits inside, an element with data-human-only (agreed with Web) is listed by ui_screen as \"(human-only: Shubham taps this himself)\" but ui_control refuses to click it, type into it or press a key on it, with an error telling the Assistant to ask him to tap it (checked in the browser: refused, while a plain button still works). The overlay panel itself is already outside what the driver reads or presses. ui_invoke calls the CRM's own handlers, not elements, so there is nothing under the marker there. 2) The Assistant's brief (src/overlay/brief.ts, v4) now has an Approvals / Send-as-me section: it never approves or claims to, tells him which agent waits and where, and prepares a card with prepare_send {floor, agent, text, why} (Web's tool) for his tap.",
      "2026-11-02 (Web): BUILT, the smallest safe version, one publish with F-077 and Overlay's parts. In the overlay: tabs Chat / Approvals / Send as me; a count badge on the button (and on the tab); the button opens on Approvals when something waits. APPROVALS: every chat waiting at a prompt (ChatState 'question') on any floor or PC, with its agent, floor, PC, the lines its screen showed above the question (the command, the file, the tool), the question and a 44 px button per option; a tap types that number into the chat, as pressing it there. The agent re-reads the chat's screen first and refuses the answer if the prompt is not the one shown (an id hash of the context and options), so a different command with the same question can't be approved by a stale tap. A prompt with no numbered options or with boxes to tick shows Reply as me (opens Send as me on that agent). UPDATE NOW: a card at the top when a newer build is published, the Build page's own call. SEND AS ME: a To select and the message box with the F-071 mic; the words go into the chosen chat as plain input (no '[message from ...]'; the same typing as the Chats box); speaking never sends by itself. PREPARE: the Assistant's MCP tool prepare_send {floor, agent, text, why} (the Assistant's alone: isAssistantAgent) stores a card (never types anything); the Send tab shows its target and words, Edit first or Send as me, and the card goes to ITS OWN target. SAFETY: every card, button and box carries data-human-only (Overlay's ui_control refuses them); the handlers do nothing for an event with isTrusted false (checked: a script click did nothing, a real touch answered); the routes refuse a request that carries a chat's key; no MCP tool answers a prompt or sends as him; every answer and send is logged on the hub (approvals.jsonl: who, what, when, which chat) and shown in the overlay under 'What was approved or sent'. Checked: 8 new backend tests (agent/agentic/approvals.test.ts, approvals-routes.test.ts: a waiting chat is listed with its screen, a tap types the digit once, a stale or wrong answer is refused and types nothing, send-as-me is plain input and logged, a chat's key is refused on all four routes, only the Assistant prepares, the card is dropped once sent), and headless Chrome by touch at 360 on the fixture with the routes stubbed (badge, opens on Approvals, 44 px options, script click does nothing, real tap sends the answer, history, Send tab with the prepared card, real tap sends). NOT checked: 1280 (same code, no layout of its own), a real claude prompt on the phone, a prompt on another PC (the 'keys' peer op is written and type-checked, not exercised across two PCs), the Update now button actually restarting. LIMITS to tell him: the app's own page proxy adds its token for any request from this PC, so a chat with a shell (curl) could still call these routes; the guards stop the Assistant's screen control and every MCP tool. And Claude Code's own safety check can refuse outright: no prompt, nothing to approve.",
      "2026-11-02 (Lead): published in build 2026.11.01-2254. NEXT, hardening (Web, right after he updates): close the gap Web named, where any chat on this PC with a shell could call the approve and send-as-me routes through the local page proxy, which adds the token. Approvals and sends must carry proof from a REGISTERED APPROVAL DEVICE (his phone): a non-extractable WebCrypto key made in that browser, registered once from the phone, that signs each approve/send (with the prompt id and a nonce). The hub verifies the signature against registered keys only; the page proxy's token alone is not enough. This PC's own browser isn't registered by default. Keep the old way as an explicit Settings switch, off.",
      "2026-11-02 (Web): HARDENING BUILT, NOT PUBLISHED (waiting for Shubham's yes). Approvals and send-as-me now need proof from a REGISTERED APPROVAL DEVICE. The browser (his phone) makes an ECDSA P-256 signing key that is NOT extractable (WebCrypto; kept in that browser's IndexedDB, for that address only), registered once under Settings > Approval device; every approve and every send is signed with it over exactly what he saw (session, prompt id and option; or the target plus the SHA-256 of the words, plus the card id) with a nonce and the time. The hub verifies against registered public keys only: the page proxy's token alone, and a curl from a local shell, are refused (401; 403 while no device is registered). Refused, with tests: unsigned, a wrong key under a registered device's id, a changed option or changed words or another target, a signature over a different kind, a replayed nonce (a forged signature does not spend a real nonce), a signature older or newer than 60 s, a stale prompt (409 after the proof, nothing typed), a removed device. Registering: a one-time 6-digit code (5 minutes, once, a new one replaces the old). The FIRST device needs only the code shown on the same screen (there is nobody to sign): so the very first registration is as safe as the first tap on a fresh install, and a program with a shell could register first if it were quicker than he is; do it from the phone as soon as this build is on. After that: a new code needs a registered device's signature (Settings > Show a code to add a device, on the phone), and removing a device or switching the old way needs one too. This PC's own browser is not registered unless he chooses it there (a note says so on a computer). The OLD WAY (no signature) is a Settings switch, OFF; turning it on (needs a signature once there is a device) is logged. Registrations, removals and the switch are logged with the approvals. The Approvals and Send tabs show 'This device can't approve yet' with a link to Settings until the browser is registered. Needs https for the key: the phone's gate is https; on http the page says so. Checked: 8 tests of the store (Node WebCrypto as the device), 4 route tests (no device: 403 and nothing typed; a signed answer once; unsigned, forged, changed-option, stale, replay and too-old refused; a send signed over words and target; remove and the old-way switch need a signature), and a real Chrome by touch at 360 and by mouse at 1280 against the REAL agent: Chrome made its non-extractable key, registered it, its signature for a new code was accepted by the agent's Node verifier (the two agree on the format), an unsigned code request, send and switch-on were refused (401), a script click on Remove did nothing, two real taps removed it (signed). NOT checked: two real PCs, the phone's own browser (its https origin makes its own key; first registration is the thing to do there), what happens when the phone's browser clears its site data (the key is gone: register again with a code from another device, or turn the old way on from Settings on the PC if none is left). EXISTING CHATS and OVERLAY: until a device is registered, Approvals and Send as me say so and do nothing; the Assistant's prepared cards still show but can't be sent.",
      "2026-11-02 (Overlay): APPROVALS READ ONLY THE PROMPT ON SCREEN NOW. BUILT, NOT PUBLISHED. The morning's incident: Claude Code offered 'Teach auto mode about your environment?' (1 Yes / 2 Not now / 3 Don't show again); the tap on Yes started /auto-mode-setup, whose first screen has the same title, no numbered options and a footer that also says 'Esc to cancel'. Approvals read the chat's scroll-back (the last 60 lines of everything printed), so it took the new footer together with the OLD options above it and went on offering them; his later taps on '3' went into the setup screen. Now: (1) Approvals (the list and the answer) read the chat's LIVE SCREEN (the screen model; for a chat on another PC, a new 'screen' request to that PC), not the scroll-back. (2) readMenu/findMenu (screen.ts) take only the options that END AT THE FOOTER: walking up from the footer only blank lines, rules and indented description lines may come before the last option, and the numbers must run down to 1 without a gap; a plain text line or a '❯' line that is no option in between means there is no menu. So options left above a newer footer are never picked up, and a menu drawn under an older one answers with its own options only. The chat view's own menu buttons use the same reading. (3) A prompt that is not a numbered menu (the setup screen, boxes to tick) shows no option buttons and the words 'answer it in the chat itself'; the 'Reply as me' button on such a card is gone (it was always refused now, since nothing is typed into a chat at a prompt). A screen that cannot be had (an older member PC) gives words around it but no buttons. Tests: approvals.test.ts (the exact offer-then-setup sequence, a menu under an older menu, numbers that skip) and approvals-routes.test.ts (the same through the real API, with the setup screen drawn below the offer and after a clear: no stale options, a tap on the old id or the new id gets 409 and types nothing). tsc, oxlint --deny-warnings and the node tests       "2026-11-02 (Connection): M1 hole closed, part 2 (in Dev, not yet published): the same check for chats on a member PC. The hub's typeInto asks the member to refuse a draft; the member, which knows its own screens, answers and the hub returns 409. A refused message starts no cooldown and opens no order; a broadcast counts such a chat among the skipped.",
      "2026-11-04 (Lead): Order o4a52. Shubham: \"this pc which is running the build should have full access now, even if I'm trying to put this device as a device. I'm on the main device ... still not allowing me to add device\".\nTHE CAUSE (Lead checked):\n- approval-devices.json held ONE device, \"My phone\" (added 2 Nov). Its signing key lives in the phone browser's storage for the OLD origin, https://server.tailc768e5.ts.net:5173, which died with the tailnet move.\n- So the phone can't sign or show a code at the new origin. With count 1 there is no first-device bootstrap, so nobody could add a device, and signed approvals were blocked too.\n- \"This PC is trusted\" was NOT added: every agent on this PC can use the page token, which is why F-076 refuses it.\nTHE FIX: \"Recover from this PC\", gated by a Windows administrator (UAC) prompt that agents can't click. Lead checked: EnableLUA 1, ConsentPromptBehaviorAdmin 5, PromptOnSecureDesktop 1, and the agents run un-elevated.\n- Connection's agent/agentic/approval-recovery.ts. `start` (human-only) makes a random token, kept in memory for 5 minutes. Windows' own reg.exe, run with RunAs, writes it to HKLM\\SOFTWARE\\ShubhamAgentic ApprovalRecovery; the prompt names \"Registry Console Tool (Microsoft Windows)\".\n- `start` also returns a one-time `ticket` to its caller only. `finish` needs that ticket, plus the HKLM value equal to the token and under 5 minutes old.\n- Then one 6-digit code registers this browser. A wrong or missing ticket gives 403 and ends that recovery, so a program racing the page can't take the code.\n- Limits: one prompt at a time, 30 s apart, 5 an hour. Every step is logged; the token never is.\n- Devices now store the page origin they registered from, as information only.\n- Linux and macOS say \"not built yet\".\n- Gate (Connection): tsc -b and oxlint clean; test:agent 2,003 with 2,001 pass, 0 fail and 2 skipped; e2e 11/11; vite build OK.\n- Web's page (the card, states, origin notes, signed Remove) merges next.\n- The real UAC check waits for Shubham at the PC, after a publish.\n- FOR NOW: \"Lead, reset the approval devices\" is offered as a one-time unblock.",
      "2026-11-04 (Web): Order o4a52, the page part, merged into Dev (not published). Settings › Approval device, when this browser is not registered, other devices are, and the page is on this PC (localhost, 127.0.0.1 or [::1]): a card \"Can't reach your registered device?\" (src/approvals/RecoverFromThisPc.tsx, recovery.ts). Before anything starts it says Windows will ask \"Do you want to allow Registry Console Tool (Microsoft Windows) to make changes?\", that only he can say yes, and to click Yes only if he started it here just now. \"Recover from this PC\" calls start (which gives a one-time ticket, held in page memory only), then the page looks about every 1.5 s and says each state in plain words (waiting, ready, declined, failed with the agent's detail, expired, used; unsupported shows the agent's reason and nothing else). When Windows was answered Yes, \"Finish and register this browser\" sends finish with {ticket} (never without one, since a wrong or missing ticket ends the recovery; after a page reload there is no ticket, so it says Start again), then registers this browser at once with the code and origin: location.origin. Each device now shows \"Registered at <origin>\" when it has one (src/approvals/DeviceSetting.tsx); an origin from another tailnet than this PC's now gets \"That address is from the old tailnet and no longer exists: this device can't sign any more\" (Register this browser first, then remove it), another address on the same tailnet gets \"Registered from another address: it can only sign there\", and Remove is the existing signed one (shared/page-address.ts originNote, with tests). Checked in Chrome against a stand-in for the routes (not the real agent) at 1280 and 360 wide, light and dark: start, waiting, ready, finish, registered with its origin, then the old-tailnet device removed with the new key's signature; declined, failed and unsupported show their words and Start again works. NOT checked: the real routes with a real Windows prompt (Shubham at this PC, after a publish) and a real phone.",

<script>
  const features = JSON.parse(document.getElementById('features').textContent);
  const list = document.getElementById('list');
  const tickSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  let filter = 'all';

  function fmt(d) {
    const t = new Date(d + 'T00:00:00');
    return isNaN(t) ? d : t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    const built = features.filter(f => f.done).length;
    document.getElementById('progress').textContent =
      features.length ? `${built} of ${features.length} built` : '';
    list.replaceChildren();
    const shown = features.filter(f => filter === 'all' || (filter === 'done') === Boolean(f.done));
    if (!shown.length) {
      list.append(el('li', 'empty', features.length ? 'Nothing here.' : 'No features yet. Describe the first one in any Claude chat and it will be logged here.'));
      return;
    }
    for (const f of shown) {
      const li = el('li', 'feature' + (f.done ? ' done' : ''));
      const tick = el('div', 'tick');
      tick.title = f.done ? 'Built' : 'Not built yet';
      if (f.done) tick.innerHTML = tickSvg;
      const body = el('div');
      const head = el('div', 'head');
      head.append(el('span', 'id', f.id), el('h2', '', f.title), el('span', 'status', f.done ? 'Built' : 'Not built'));
      body.append(head, el('blockquote', '', f.said));
      if (f.notes && f.notes.length) {
        const ul = el('ul', 'notes');
        for (const n of f.notes) ul.append(el('li', '', n));
        body.append(ul);
      }
      let meta = `Asked ${fmt(f.added)}`;
      if (f.done) meta += ` · Built ${fmt(f.done)}` + (f.doneNote ? ` · ${f.doneNote}` : '');
      body.append(el('div', 'meta', meta));
      li.append(tick, body);
      list.append(li);
    }
  }

  for (const b of document.querySelectorAll('[data-filter]')) {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      for (const o of document.querySelectorAll('[data-filter]')) o.setAttribute('aria-pressed', String(o === b));
      render();
    });
  }
  render();
</script>
