<script>
  const features = JSON.parse(document.getElementById('features').textContent);
  const list = document.getElementById('list');
  const tickSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  let filter = 'all';

  function fmt(d) {
    const t = new Date(d + 'T00:00:00');
    return isNaN(t) ? d : t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    const built = features.filter(f => f.done).length;
    document.getElementById('progress').textContent =
      features.length ? `${built} of ${features.length} built` : '';
    list.replaceChildren();
    const shown = features.filter(f => filter === 'all' || (filter === 'done') === Boolean(f.done));
    if (!shown.length) {
      list.append(el('li', 'empty', features.length ? 'Nothing here.' : 'No features yet. Describe the first one in any Claude chat and it will be logged here.'));
      return;
    }
    for (const f of shown) {
      const li = el('li', 'feature' + (f.done ? ' done' : ''));
      const tick = el('div', 'tick');
      tick.title = f.done ? 'Built' : 'Not built yet';
      if (f.done) tick.innerHTML = tickSvg;
      const body = el('div');
      const head = el('div', 'head');
      head.append(el('span', 'id', f.id), el('h2', '', f.title), el('span', 'status', f.done ? 'Built' : 'Not built'));
      body.append(head, el('blockquote', '', f.said));
      if (f.notes && f.notes.length) {
        const ul = el('ul', 'notes');
        for (const n of f.notes) ul.append(el('li', '', n));
        body.append(ul);
      }
      let meta = `Asked ${fmt(f.added)}`;
      if (f.done) meta += ` · Built ${fmt(f.done)}` + (f.doneNote ? ` · ${f.doneNote}` : '');
      body.append(el('div', 'meta', meta));
      li.append(tick, body);
      list.append(li);
    }
  }

  for (const b of document.querySelectorAll('[data-filter]')) {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      for (const o of document.querySelectorAll('[data-filter]')) o.setAttribute('aria-pressed', String(o === b));
      render();
    });
  }
  render();
</script>
